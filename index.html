<script>

// ================= NORMALIZAR =================
function normalizar(texto){
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// ================= DESTACAR =================
function destacar(textoOriginal, termoBusca){
    if(!termoBusca) return textoOriginal;

    const textoNormalizado = normalizar(textoOriginal);
    const palavras = normalizar(termoBusca).split(" ").filter(p => p.length > 0);
    let marcacoes = [];

    palavras.forEach(p => {
        let i = 0;
        while(true){
            let idx = textoNormalizado.indexOf(p, i);
            if(idx === -1) break;
            marcacoes.push({inicio: idx, fim: idx + p.length});
            i = idx + p.length;
        }
    });

    if(!marcacoes.length) return textoOriginal;

    marcacoes.sort((a,b)=>a.inicio-b.inicio || b.fim-a.fim);
    let mesclado = [];
    let atual = marcacoes[0];

    for(let i=1;i<marcacoes.length;i++){
        let p = marcacoes[i];
        if(p.inicio <= atual.fim){
            atual.fim = Math.max(atual.fim, p.fim);
        } else {
            mesclado.push(atual);
            atual = p;
        }
    }
    mesclado.push(atual);

    let resultado = "";
    let ultimo = 0;
    mesclado.forEach(m=>{
        resultado += textoOriginal.slice(ultimo, m.inicio);
        resultado += `<span class="highlight">${textoOriginal.slice(m.inicio, m.fim)}</span>`;
        ultimo = m.fim;
    });
    resultado += textoOriginal.slice(ultimo);
    return resultado;
}

// ================= FUNÇÕES EXTRA =================
function copiarCEP(cep){
    navigator.clipboard.writeText(cep).then(()=>{
        alert("CEP copiado: " + cep);
    });
}

function abrirMapa(endereco){
    window.open("https://www.google.com/maps/search/?api=1&query=" + endereco, "_blank");
}

// ================= DADOS =================
const dados = [
    
];

// 👉 Se quiser, cole aqui sua lista completa (mantive só alguns para não ficar gigante)

// ================= RENDER =================
const resultsDiv = document.getElementById("results");
const contador = document.getElementById("contador");
const searchInput = document.getElementById("search");

function render(lista, termoBusca=""){
    resultsDiv.innerHTML="";
    contador.innerHTML = lista.length + " resultado(s) encontrado(s)";

    lista.forEach(item=>{
        const enderecoMapa = encodeURIComponent(item.logradouro + ", " + item.bairro + ", Jaborandi SP");

        resultsDiv.innerHTML += `
        <div class="card">
            <strong>${destacar(item.logradouro, termoBusca)}</strong><br>
            ${destacar(item.bairro, termoBusca)}

            <div class="cep">
                CEP: ${destacar(item.cep, termoBusca)}
                <span class="copy-btn" onclick="copiarCEP('${item.cep}')">📋</span>
            </div>

            <button class="map-btn" onclick="abrirMapa('${enderecoMapa}')">
                📍 Ver no mapa
            </button>
        </div>
        `;
    });
}

render(dados);

// ================= BUSCA =================
searchInput.addEventListener("input", function(){
    const termoOriginal = this.value.trim();
    const termoNormalizado = normalizar(termoOriginal);
    let palavras = termoNormalizado.split(" ").filter(p => p.length > 0);

    const filtrado = dados.filter(item=>{
        const texto = normalizar(item.logradouro + " " + item.bairro + " " + item.cep);
        return palavras.every(p => texto.includes(p));
    });

    render(filtrado, termoOriginal);
});

</script>
